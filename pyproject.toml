[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meshtrain"
version = "0.1.0"
description = "An experimental distributed training runtime for heterogeneous consumer hardware."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pyyaml>=6",
    "pydantic>=2.6",
    "psutil>=5.9",
    "numpy>=1.26",
]

[project.scripts]
meshtrain = "meshtrain.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "cuda: requires a physical CUDA device",
    "mps: requires an Apple MPS device",
    "slow: longer-running integration test",
]
